<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Madd Animation — pixel ambient</title>
    <style>
      :root {
        --bg: #050505;
        --fg: #9a9a9a;
        --hi: #d0d0d0;
        --line: #1a1a1a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
        font-size: 13px;
      }
      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
        padding-bottom: 120px;
      }
      canvas {
        width: min(100vw - 16px, calc((100vh - 140px) * 16 / 9));
        aspect-ratio: 16 / 9;
        height: auto;
        max-height: calc(100vh - 140px);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 12px 16px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.92));
        border-top: 1px solid var(--line);
        max-height: 42%;
        overflow: auto;
      }
      .bar .meta {
        flex: 1 1 100%;
        order: -1;
        margin-bottom: 4px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      .bar .blurb {
        opacity: 0.7;
      }
      .downloads {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      button,
      a.btn {
        appearance: none;
        border: 1px solid #2a2a2a;
        background: #111;
        color: var(--fg);
        padding: 8px 12px;
        cursor: pointer;
        font: inherit;
        text-decoration: none;
        display: inline-block;
      }
      button:hover,
      button.active,
      a.btn:hover {
        border-color: #555;
        color: var(--hi);
        background: #181818;
      }
      button:disabled,
      a.btn.is-busy {
        opacity: 0.5;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="c" width="1920" height="1080"></canvas>
    </div>
    <div class="bar" id="bar"></div>
    <script type="module">
      import {
        VARIANT_IDS,
        VARIANT_META,
        GRID_W,
        GRID_H,
        OUT_W,
        OUT_H,
        DURATION,
        FPS,
        FRAME_COUNT,
        paintFrame,
        gridToRgb,
        upscaleNearest,
      } from "./engine.js";

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d", { alpha: false });
      const img = ctx.createImageData(OUT_W, OUT_H);
      const grid = new Float32Array(GRID_W * GRID_H);
      const rgb = new Uint8ClampedArray(GRID_W * GRID_H * 3);

      let variant =
        new URLSearchParams(location.search).get("v") || VARIANT_IDS[0];
      if (!VARIANT_IDS.includes(variant)) variant = VARIANT_IDS[0];

      const bar = document.getElementById("bar");
      const meta = document.createElement("div");
      meta.className = "meta";
      const blurb = document.createElement("span");
      blurb.className = "blurb";
      const downloads = document.createElement("div");
      downloads.className = "downloads";

      const gifBtn = document.createElement("button");
      gifBtn.type = "button";
      gifBtn.textContent = "Download GIF";
      const mp4Btn = document.createElement("a");
      mp4Btn.className = "btn";
      mp4Btn.textContent = "Download MP4";
      mp4Btn.setAttribute("download", "");

      downloads.append(gifBtn, mp4Btn);
      meta.append(blurb, downloads);
      bar.appendChild(meta);

      for (const id of VARIANT_IDS) {
        const b = document.createElement("button");
        b.textContent = VARIANT_META[id].title;
        b.dataset.id = id;
        b.addEventListener("click", () => {
          variant = id;
          history.replaceState(null, "", `?v=${id}`);
          syncButtons();
        });
        bar.appendChild(b);
      }

      function syncButtons() {
        for (const b of bar.querySelectorAll("button[data-id]")) {
          b.classList.toggle("active", b.dataset.id === variant);
        }
        blurb.textContent = VARIANT_META[variant].blurb;
        mp4Btn.href = `./out/${variant}.mp4`;
        mp4Btn.download = `${variant}.mp4`;
      }
      syncButtons();

      function saveBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

      gifBtn.addEventListener("click", async () => {
        gifBtn.disabled = true;
        const prev = gifBtn.textContent;
        gifBtn.textContent = "Encoding GIF…";
        try {
          const { GIFEncoder, quantize, applyPalette } = await import(
            "https://esm.sh/gifenc@1.0.3"
          );
          const gif = GIFEncoder();
          const delay = Math.round(1000 / FPS);
          const g = new Float32Array(GRID_W * GRID_H);
          const low = new Uint8ClampedArray(GRID_W * GRID_H * 3);
          const rgba = new Uint8ClampedArray(OUT_W * OUT_H * 4);

          for (let i = 0; i < FRAME_COUNT; i++) {
            paintFrame(variant, g, i / FRAME_COUNT);
            gridToRgb(g, low);
            upscaleNearest(low, rgba);
            // gifenc expects flat RGB(A) — strip alpha channel copy
            const rgbFlat = new Uint8Array(OUT_W * OUT_H * 3);
            for (let p = 0, q = 0; p < rgba.length; p += 4, q += 3) {
              rgbFlat[q] = rgba[p];
              rgbFlat[q + 1] = rgba[p + 1];
              rgbFlat[q + 2] = rgba[p + 2];
            }
            const palette = quantize(rgbFlat, 48);
            const index = applyPalette(rgbFlat, palette);
            gif.writeFrame(index, OUT_W, OUT_H, {
              palette,
              delay,
              repeat: 0,
            });
            gifBtn.textContent = `Encoding GIF… ${i + 1}/${FRAME_COUNT}`;
            await new Promise((r) => setTimeout(r, 0));
          }
          gif.finish();
          saveBlob(
            new Blob([gif.bytes()], { type: "image/gif" }),
            `${variant}.gif`
          );
        } catch (err) {
          console.error(err);
          blurb.textContent = `GIF encode failed: ${err.message || err}`;
        } finally {
          gifBtn.disabled = false;
          gifBtn.textContent = prev;
        }
      });

      const t0 = performance.now();
      function frame(now) {
        const tNorm = ((now - t0) / 1000 / DURATION) % 1;
        paintFrame(variant, grid, tNorm);
        gridToRgb(grid, rgb);
        upscaleNearest(rgb, img.data);
        ctx.putImageData(img, 0, 0);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
